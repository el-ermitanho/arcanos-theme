name: Empaquetar y publicar

# En cada push a main se revisan los temas y se empaqueta el .vsix.
# Si la versión de package.json todavía no tiene release (v<versión>), además se publica en Open VSX
# y se crea la release con su etiqueta. Para publicar otra versión basta con subir el número en package.json.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  vsix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Generar temas y revisar contraste
        run: node scripts/generar.mjs
      - name: Los temas del repo están al día
        run: git diff --exit-code themes/
      - name: Empaquetar
        run: npx vsce package --no-dependencies -o arcanos-theme.vsix
      - uses: actions/upload-artifact@v4
        with:
          name: arcanos-theme
          path: arcanos-theme.vsix

      - name: ¿Versión nueva?
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="v$(node -p "require('./package.json').version")"
          echo "etiqueta=$v" >> "$GITHUB_OUTPUT"
          if gh release view "$v" >/dev/null 2>&1; then echo "nueva=no" >> "$GITHUB_OUTPUT"; echo "$v ya está publicada";
          else echo "nueva=si" >> "$GITHUB_OUTPUT"; echo "$v es nueva: se publica"; fi

      - name: Publicar en Open VSX
        if: steps.version.outputs.nueva == 'si'
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          if [ -z "$OVSX_PAT" ]; then echo "::error::Falta el secreto OVSX_PAT (token de open-vsx.org)"; exit 1; fi
          # La primera vez crea el espacio «davidsant7e» (si ya existe, sigue).
          npx ovsx create-namespace davidsant7e -p "$OVSX_PAT" || true
          npx ovsx publish arcanos-theme.vsix -p "$OVSX_PAT"

      - name: Release en GitHub
        if: steps.version.outputs.nueva == 'si'
        env:
          GH_TOKEN: ${{ github.token }}
          ETIQUETA: ${{ steps.version.outputs.etiqueta }}
        run: |
          gh release create "$ETIQUETA" arcanos-theme.vsix --target "$GITHUB_SHA" --title "Arcanos Theme $ETIQUETA" \
            --notes "Instálalo desde Open VSX (Arcanos Theme) o con Extensions: Install from VSIX…"
