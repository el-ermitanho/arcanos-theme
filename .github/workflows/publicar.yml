name: Empaquetar y publicar

# En cada push se revisan los temas y se empaqueta el .vsix.
# Al subir una etiqueta v* (p. ej. v1.0.0) además se publica en Open VSX y en una release de GitHub.
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  vsix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --omit=optional
      - name: Generar temas y revisar contraste
        run: node scripts/generar.mjs
      - name: Los temas del repo están al día
        run: git diff --exit-code themes/
      - name: Empaquetar
        run: npx vsce package --no-dependencies -o arcanos-theme.vsix
      - uses: actions/upload-artifact@v4
        with:
          name: arcanos-theme
          path: arcanos-theme.vsix

      - name: Publicar en Open VSX
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          if [ -z "$OVSX_PAT" ]; then echo "::error::Falta el secreto OVSX_PAT (token de open-vsx.org)"; exit 1; fi
          # La primera vez crea el espacio «davidsant7e» (si ya existe, sigue).
          npx ovsx create-namespace davidsant7e -p "$OVSX_PAT" || true
          npx ovsx publish arcanos-theme.vsix -p "$OVSX_PAT"

      - name: Release en GitHub
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" arcanos-theme.vsix --title "Arcanos Theme $GITHUB_REF_NAME" \
            --notes "Instálalo desde Open VSX (Arcanos Theme) o con Extensions: Install from VSIX…" \
            || gh release upload "$GITHUB_REF_NAME" arcanos-theme.vsix --clobber
